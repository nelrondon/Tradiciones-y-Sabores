# ==============================================================================
# CONFIGURACIÓN DE PROXY INVERSO NGINX (HTTP INTERNO)
# ==============================================================================

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;

    # --------------------------------------------------------------------------
    # A. FRONTEND: Archivos Estáticos SPA (Single Page Application)
    # --------------------------------------------------------------------------
    location / {
        root /var/www/html/dist;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # --------------------------------------------------------------------------
    # B. BACKEND API: Redirección a la API Express en Node.js (backend:3000)
    # --------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://backend:3000/api/;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --------------------------------------------------------------------------
    # C. n8n AUTOMATIZACIÓN: Redirección de Webhooks hacia n8n (n8n:5678)
    # --------------------------------------------------------------------------
    location /webhook/ {
        proxy_pass http://n8n:5678/webhook/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
