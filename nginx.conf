server {
    listen 80;
    listen [::]:80;
    server_name 158.220.100.226;

    # ── Frontend estático (React/Vite compilado) ───────────────
    root /var/www/restaurantequis;
    index index.html;

    # ── Reverse Proxy → FastAPI en :5000 ──────────────────────
    # El frontend llama a /api/... → nginx lo redirige internamente
    # al backend uvicorn. El puerto 5000 NO necesita estar abierto
    # en el firewall público.
    location /api/ {
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # Docs de FastAPI (Swagger UI) — accesible desde /docs
    location /docs {
        proxy_pass         http://127.0.0.1:5000/docs;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
    }

    location /openapi.json {
        proxy_pass         http://127.0.0.1:5000/openapi.json;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
    }

    # ── SPA fallback ──────────────────────────────────────────
    location / {
        try_files $uri $uri/ @spa;
    }

    location @spa {
        rewrite ^ /index.html last;
    }

    # ── Assets con caché agresivo ─────────────────────────────
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── Compresión ────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # ── Seguridad ─────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}
