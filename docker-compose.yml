version: '3.8'

services:
  # ── Base de Datos PostgreSQL 16 ──────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: restaurant_equis_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: restaurant_equis
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # ── Backend API FastAPI ─────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: restaurant_equis_api
    restart: always
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: restaurant_equis
      DB_USER: postgres
      DB_PASSWORD: postgres
      CORS_ORIGINS: "*"
    ports:
      - "5000:5000"
    depends_on:
      - postgres

  # ── Frontend React + Nginx Proxy ───────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: restaurant_equis_web
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
