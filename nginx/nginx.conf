# ==============================================================================
# CONFIGURACIÓN DE PROXY INVERSO NGINX CON CIFRADO HTTPS/TLS COMPLETO
# Proyecto: Restaurante "Tradición y Sabor"
# Ubicación organizada: /docker/nginx/nginx.conf
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. SERVIDOR HTTP (Puerto 80): Redirección Automática Obligatoria a HTTPS (Puerto 443)
# ------------------------------------------------------------------------------
server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;

    # Redirigir todo el tráfico no seguro a HTTPS mediante código de estado 301
    return 301 https://$host$request_uri;
}

# ------------------------------------------------------------------------------
# 2. SERVIDOR HTTPS SEGURO (Puerto 443): Cifrado Completo de Datos (Ingreso / Egreso)
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;

    server_name _;

    # Certificados SSL / TLS montados en el contenedor
    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    # Parámetros de Seguridad TLS Avanzados (Recomendados DevOps Senior)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # --------------------------------------------------------------------------
    # A. FRONTEND: Archivos Estáticos SPA (Single Page Application)
    # --------------------------------------------------------------------------
    location / {
        root /var/www/html/dist;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # --------------------------------------------------------------------------
    # B. BACKEND API: Redirección Segura a la API Express en Node.js (backend:3000)
    # --------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://backend:3000/api/;
        proxy_http_version 1.1;

        # Encabezados HTTP requeridos para WebSockets y Preservación de IP Cliente
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --------------------------------------------------------------------------
    # C. n8n AUTOMATIZACIÓN: Redirección Segura de Webhooks hacia n8n (n8n:5678)
    # --------------------------------------------------------------------------
    location /webhook/ {
        proxy_pass http://n8n:5678/webhook/;
        proxy_http_version 1.1;

        # Preservación de encabezados para Webhooks de WhatsApp y APIs de terceros
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
